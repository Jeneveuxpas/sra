# Accelerate launcher settings only. Training hyperparameters live in
# configs/sit-b2-sra-cls.yaml and are loaded by train.py --config.
compute_environment: LOCAL_MACHINE
debug: false
distributed_type: MULTI_GPU
downcast_bf16: 'no'
machine_rank: 0
main_training_function: main
mixed_precision: fp16
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
num_machines: 1
num_processes: 8
